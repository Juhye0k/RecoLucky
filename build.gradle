plugins {
    id 'java'
    id 'application'
}

group = 'com.weighbridge'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Jackson for JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    // Test
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.weighbridge.parser.WeighbridgeParserApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// OneDrive 경로에 한글/공백이 포함되어 테스트 실행기 클래스패스 문제 발생 시
// 빌드 디렉토리를 ASCII 경로로 변경
if (System.getProperty('os.name')?.toLowerCase()?.contains('windows')
        || System.getenv('WSLENV') != null
        || project.projectDir.absolutePath.contains(' ')) {
    layout.buildDirectory = file("C:/tmp/weighbridge-build")
}

test {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
    systemProperty 'file.encoding', 'UTF-8'
}
